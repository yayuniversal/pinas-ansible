#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

flust ruleset

# destroy table inet filter

table inet filter {
    chain wireguard {
        set 
    }

    chain input {
        type filter hook input priority filter
        policy drop

        ct state invalid drop comment "early drop of invalid connections"
        ct state {established, related} accept comment "allow tracked connections"

        # Allow wireguard on interface {{ internet_interface }}
        iif {{ internet_interface }} tcp dport ssh accept

        # Allow wireguard from internet ({{ internet_interface }})
        # {{ wireguard_listen_port }}/udp
        iif "{{ internet_interface }}" udp dport "{{ wireguard_listen_port }}" accept

        iif 

    }

    chain output {
        type filter hook output priority filter
        policy accept
    }
}
